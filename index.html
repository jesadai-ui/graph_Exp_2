                x: names, y: cfg.d.y, type: 'bar', showlegend: false,
                marker: { color: colors },
                error_y: { type: 'data', array: cfg.d.e, visible: true, color: '#2c3e50', thickness: 1.5 }
            });
        }

        let layout = {
            font: fontConfig,
            margin: { t: 30, b: 35, l: 70, r: 30 },
            xaxis: { ...axisConfig, title: { text: `<b>${cfg.xt}</b>`, standoff: 10 } }, 
            yaxis: { ...axisConfig, title: { text: `<b>${cfg.yt}</b>`, standoff: 12 } }
        };

        if (cfg.type !== 'summary') {
            layout.legend = { 
                orientation: 'h', x: 0.5, xanchor: 'center', y: 1.08, yanchor: 'bottom',
                font: { family: 'Sarabun', size: 16, color: '#34495e' },
                itemwidth: 175
            };
            layout.margin.t = 70; 
        } else {
            layout.xaxis.title.font = summaryAxisTitleFont;
            layout.margin.t = 45; 
            layout.margin.b = 10; 
            layout.annotations = [];
            for (let i = 0; i < 3; i++) {
                let val = cfg.d.y[i];
                let err = cfg.d.e[i];
                let isPositive = val >= 0;
                let yPosition = isPositive ? (val + err) : (val - err);
                layout.annotations.push({
                    x: names[i],
                    y: yPosition,
                    text: `<b>${val}</b>`, 
                    showarrow: false,
                    xanchor: 'center',
                    yanchor: isPositive ? 'bottom' : 'top', 
                    yshift: isPositive ? 10 : -10, 
                    font: { family: 'Sarabun', size: 20, color: '#2c3e50' }
                });
            }
        }
        
        if (cfg.type === 'bar') layout.barmode = 'group';

        const configOptions = { responsive: true, toImageButtonOptions: { format: 'png', filename: `Chart_${index+1}`, height: 500, width: 750, scale: 10 } };

        Plotly.newPlot(plotDiv.id, traces, layout, configOptions);
    });
</script>
</body>
</html>
